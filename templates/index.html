<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI - Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-card: rgba(10, 12, 28, 0.85);
            --border-cosmic: rgba(0, 240, 255, 0.45);
            --primary-glow: #7b61ff;
            --cyan-glow: #00f0ff;
            --pink-glow: #ff007f;
            --text-main: #f0f3ff;
            --text-muted: #e2e8f0;
            --radius-cosmic: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05070f;
            background-image: 
                linear-gradient(rgba(5, 7, 15, 0.35), rgba(5, 7, 15, 0.45)),
                url('https://i.postimg.cc/Hx5hQ7VG/cosmic-bg-jpg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(8, 10, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .nav-brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 8px rgba(0, 240, 255, 0.4));
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-nav {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid var(--border-cosmic);
            background: rgba(123, 97, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--pink-glow) 100%);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        .hero-section {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #ffffff 30%, #00f0ff 70%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
        }

        .hero-subtitle {
            color: #ffffff;
            font-size: 1.15rem;
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.7;
            font-weight: 500;
            padding: 14px 28px;
            background: rgba(5, 7, 18, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.15);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 50px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-cosmic);
            border-radius: var(--radius-cosmic);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 240, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary-glow), var(--cyan-glow), var(--pink-glow));
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
            display: block;
            margin-bottom: 8px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        input, select {
            width: 100%;
            background: rgba(8, 10, 21, 0.9) !important;
            border: 1px solid var(--border-cosmic) !important;
            color: var(--text-main) !important;
            border-radius: 12px !important;
            padding: 14px 18px !important;
            margin-bottom: 22px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none !important;
            border-color: var(--cyan-glow) !important;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6) !important;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--pink-glow) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.8);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="nav-brand">✨ COSMIC AI</a>
        <nav class="nav-links">
            <a href="/" class="btn-nav">🏠 Home</a>
            <a href="/projects" class="btn-nav">🚀 Projects</a>
        </nav>
    </header>

    <main class="container">
        
        <section class="hero-section">
            <h1 class="hero-title">Buat Script Konten Lebih Cepat dengan AI</h1>
            <p class="hero-subtitle">
                Rancang outline, skrip video, dan metadata otomatis untuk TikTok, YouTube, Reels, dan platform lainnya dengan asisten bertenaga kecerdasan kosmik.
            </p>
        </section>

        <!-- DITAMBAHKAN ID generator-form DI SINI -->
        <div class="card" id="generator-form" style="max-width: 650px; margin: 0 auto;">
            <h2 style="font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 700; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);">
                💫 Buat Project Baru
            </h2>

            <form action="/generate" method="POST">
                <div>
                    <label for="topic">Topik / Judul Konten</label>
                    <input type="text" id="topic" name="topic" placeholder="Contoh: 5 Tips Produktivitas untuk Mahasiswa" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label for="duration">Durasi Konten</label>
                        <select id="duration" name="duration" required>
                            <option value="Ultra-Short (30s)">Ultra-Short (30 detik / Reels / TikTok)</option>
                            <option value="Short (60s)">Short (60 detik / Standard)</option>
                            <option value="Medium (3-5 min)">Medium (3-5 menit)</option>
                            <option value="Long (8-10 min)">Long (8-10 menit / YouTube)</option>
                        </select>
                    </div>

                    <div>
                        <label for="language">Bahasa</label>
                        <select id="language" name="language" required>
                            <option value="Indonesian" selected>Indonesia</option>
                            <option value="English">Inggris</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="audience">Target Audience</label>
                    <input type="text" id="audience" name="audience" placeholder="Contoh: Gen Z, Pekerja Kantoran, Pemula" required>
                </div>

                <button type="submit" class="btn-submit">✨ Generate Script Sekarang</button>
            </form>
        </div>

    </main>
</body>
</html>
