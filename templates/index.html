<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI - Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           COSMIC AI - DEEP SPACE & PLANET THEME
           ========================================== */
        :root {
            --bg-space: #05070f;
            --bg-card: rgba(13, 17, 33, 0.85);
            --border-cosmic: rgba(123, 97, 255, 0.35);
            --primary-glow: #7b61ff;
            --cyan-glow: #00f0ff;
            --text-main: #f0f3ff;
            --text-muted: #94a3b8;
            --radius-cosmic: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-space);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(123, 97, 255, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.18) 0%, transparent 45%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* NAVBAR HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(8, 10, 21, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-cosmic);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-nav {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid var(--border-cosmic);
            background: rgba(123, 97, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, var(--primary-glow) 0%, #4a00e0 100%);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        /* CONTAINER & CARDS */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-cosmic);
            border-radius: var(--radius-cosmic);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary-glow), var(--cyan-glow));
        }

        /* DEKORASI PLANET */
        .planet-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        .planet-1 {
            width: 160px; height: 160px;
            top: 15%; right: -30px;
            background: radial-gradient(circle at 30% 30%, #7b61ff, #1e0b50);
            box-shadow: 0 0 50px rgba(123, 97, 255, 0.4);
        }

        .planet-2 {
            width: 110px; height: 110px;
            bottom: 15%; left: -30px;
            background: radial-gradient(circle at 30% 30%, #00f0ff, #004d61);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(8deg); }
        }

        /* FORM & INPUTS */
        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background: rgba(8, 10, 21, 0.9) !important;
            border: 1px solid var(--border-cosmic) !important;
            color: var(--text-main) !important;
            border-radius: 12px !important;
            padding: 14px 18px !important;
            margin-bottom: 22px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none !important;
            border-color: var(--cyan-glow) !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.45) !important;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-glow) 0%, #4a00e0 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(123, 97, 255, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <!-- DEKORASI PLANET MELAYANG -->
    <div class="planet-container">
        <div class="planet planet-1"></div>
        <div class="planet planet-2"></div>
    </div>

    <!-- NAVBAR HEADER -->
    <header>
        <a href="/" class="nav-brand">
            ✨ COSMIC AI
        </a>
        <nav class="nav-links">
            <a href="/" class="btn-nav">🏠 Home</a>
            <a href="/projects" class="btn-nav">🚀 Projects</a>
        </nav>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- HERO SECTION -->
        <section style="text-align: center; margin-top: 20px; margin-bottom: 45px;">
            <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #ffffff 20%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
                Buat Script Konten Lebih Cepat dengan AI
            </h1>
            <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 650px; margin: 0 auto; line-height: 1.6;">
                Rancang outline, skrip video, dan metadata otomatis untuk TikTok, YouTube, Reels, dan platform lainnya dengan asisten bertenaga kecerdasan kosmik.
            </p>
        </section>

        <!-- FORM GENERATOR -->
        <div class="card" style="max-width: 650px; margin: 0 auto;">
            <h2 style="font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 700;">
                💫 Buat Project Baru
            </h2>

            <form action="/generate" method="POST">
                
                <div>
                    <label for="topic">Topik / Judul Konten</label>
                    <input 
                        type="text" 
                        id="topic" 
                        name="topic" 
                        placeholder="Contoh: 5 Tips Produktivitas untuk Mahasiswa" 
                        required
                    >
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label for="duration">Durasi Konten</label>
                        <select id="duration" name="duration" required>
                            <option value="Short (60s)">Short (60 detik / Reels / TikTok)</option>
                            <option value="Medium (3-5 min)">Medium (3-5 menit)</option>
                            <option value="Long (8-10 min)">Long (8-10 menit / YouTube)</option>
                        </select>
                    </div>

                    <div>
                        <label for="language">Bahasa</label>
                        <select id="language" name="language" required>
                            <option value="Indonesian" selected>Indonesia</option>
                            <option value="English">Inggris</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="audience">Target Audience</label>
                    <input 
                        type="text" 
                        id="audience" 
                        name="audience" 
                        placeholder="Contoh: Gen Z, Pekerja Kantoran, Pemula" 
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">
                    ✨ Generate Script Sekarang
                </button>

            </form>
        </div>

    </main>

</body>
</html>
