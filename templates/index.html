<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI - Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           COSMIC AI - PURE CSS NEON GALAXY & PLANETS
           ========================================== */
        :root {
            --bg-space: #03040a;
            --bg-card: rgba(10, 13, 28, 0.85);
            --border-cosmic: rgba(0, 240, 255, 0.4);
            --primary-glow: #7b61ff;
            --cyan-glow: #00f0ff;
            --pink-glow: #ff007f;
            --text-main: #f0f3ff;
            --text-muted: #cbd5e1;
            --radius-cosmic: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-space);
            /* Nebula Galaksi Berwarna Warni Menggunakan Gradasi Murni */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 127, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(123, 97, 255, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 230, 0, 0.08) 0%, transparent 30%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ORNAMENT KOSMIK (PLANET, CINCIN, DAN SATELIT NEON) */
        .space-backstage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        /* Planet Ungu Raksasa + Cincin di Atas Kanan */
        .large-cosmos {
            position: absolute;
            top: 10%; right: 4%;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7b61ff, #ff007f, #0e021a);
            box-shadow: 0 0 50px rgba(123, 97, 255, 0.5), inset -15px -15px 30px rgba(0,0,0,0.8);
            animation: floatLarge 12s ease-in-out infinite;
        }

        .large-cosmos::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 230px; height: 50px;
            border: 3px solid rgba(0, 240, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Planet Biru Es di Bawah Kiri */
        .icy-cosmos {
            position: absolute;
            bottom: 12%; left: 4%;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00f0ff, #0a4060, #010c14);
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.45), inset -10px -10px 20px rgba(0,0,0,0.9);
            animation: floatIce 16s ease-in-out infinite;
        }

        /* Planet Api Menyala */
        .fire-cosmos {
            position: absolute;
            top: 60%; right: 7%;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff5500, #ffaa00, #1a0000);
            box-shadow: 0 0 40px rgba(255, 85, 0, 0.5), inset -8px -8px 15px rgba(0,0,0,0.9);
            animation: floatFire 14s ease-in-out infinite;
        }

        /* Animasi Melayang Lambat */
        @keyframes floatLarge {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        @keyframes floatIce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }

        @keyframes floatFire {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* NAVBAR HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(8, 10, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.35);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .nav-brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-nav {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid var(--border-cosmic);
            background: rgba(123, 97, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--pink-glow) 100%);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        /* CONTAINER & GLASS CARDS */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-cosmic);
            border-radius: var(--radius-cosmic);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary-glow), var(--cyan-glow), var(--pink-glow));
        }

        /* FORM & INPUTS */
        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background: rgba(8, 10, 21, 0.85) !important;
            border: 1px solid var(--border-cosmic) !important;
            color: var(--text-main) !important;
            border-radius: 12px !important;
            padding: 14px 18px !important;
            margin-bottom: 22px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none !important;
            border-color: var(--cyan-glow) !important;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6) !important;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--pink-glow) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.8);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- DEKORASI PLANET NEON & GALAXY -->
    <div class="space-backstage">
        <div class="large-cosmos"></div>
        <div class="icy-cosmos"></div>
        <div class="fire-cosmos"></div>
    </div>

    <!-- NAVBAR HEADER -->
    <header>
        <a href="/" class="nav-brand">
            ✨ COSMIC AI
        </a>
        <nav class="nav-links">
            <a href="/" class="btn-nav">🏠 Home</a>
            <a href="/projects" class="btn-nav">🚀 Projects</a>
        </nav>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- HERO SECTION -->
        <section style="text-align: center; margin-top: 20px; margin-bottom: 45px;">
            <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #ffffff 20%, #00f0ff 60%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
                Buat Script Konten Lebih Cepat dengan AI
            </h1>
            <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 650px; margin: 0 auto; line-height: 1.6;">
                Rancang outline, skrip video, dan metadata otomatis untuk TikTok, YouTube, Reels, dan platform lainnya dengan asisten bertenaga kecerdasan kosmik.
            </p>
        </section>

        <!-- FORM GENERATOR -->
        <div class="card" style="max-width: 650px; margin: 0 auto;">
            <h2 style="font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 700;">
                💫 Buat Project Baru
            </h2>

            <form action="/generate" method="POST">
                
                <div>
                    <label for="topic">Topik / Judul Konten</label>
                    <input 
                        type="text" 
                        id="topic" 
                        name="topic" 
                        placeholder="Contoh: 5 Tips Produktivitas untuk Mahasiswa" 
                        required
                    >
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label for="duration">Durasi Konten</label>
                        <select id="duration" name="duration" required>
                            <option value="Short (60s)">Short (60 detik / Reels / TikTok)</option>
                            <option value="Medium (3-5 min)">Medium (3-5 menit)</option>
                            <option value="Long (8-10 min)">Long (8-10 menit / YouTube)</option>
                        </select>
                    </div>

                    <div>
                        <label for="language">Bahasa</label>
                        <select id="language" name="language" required>
                            <option value="Indonesian" selected>Indonesia</option>
                            <option value="English">Inggris</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="audience">Target Audience</label>
                    <input 
                        type="text" 
                        id="audience" 
                        name="audience" 
                        placeholder="Contoh: Gen Z, Pekerja Kantoran, Pemula" 
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">
                    ✨ Generate Script Sekarang
                </button>

            </form>
        </div>

    </main>

</body>
</html>
