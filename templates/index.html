<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI - Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           COSMIC AI - EMBEDDED STYLES (ANTI-FAIL)
           ========================================== */
        :root {
            --bg-space: #070913;
            --bg-card: rgba(18, 22, 41, 0.85);
            --border-cosmic: rgba(123, 97, 255, 0.35);
            --primary-glow: #7b61ff;
            --cyan-glow: #00f0ff;
            --pink-glow: #ff007f;
            --text-main: #f0f3ff;
            --text-muted: #94a3b8;
            --radius-cosmic: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-space);
            background-image: 
                linear-gradient(rgba(7, 9, 19, 0.5), rgba(7, 9, 19, 0.65)),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* NAVBAR & NAVIGATION BUTTONS */
        header, nav, .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(11, 14, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-cosmic);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand, .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links, .nav-menu {
            display: flex;
            gap: 15px;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a, .nav-item, .btn-nav {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-cosmic);
            background: rgba(123, 97, 255, 0.1);
            transition: all 0.2s ease;
        }

        .nav-links a:hover, .btn-nav:hover {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--pink-glow) 100%);
            border-color: var(--cyan-glow);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        /* DECORATIVE COSMIC PLANETS & FLOATING ELEMENTS */
        .planet-bg {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .planet-1 {
            width: 180px;
            height: 180px;
            top: 10%;
            right: 5%;
            background: radial-gradient(circle at 30% 30%, #7b61ff, #1e0b50);
            box-shadow: 0 0 40px rgba(123, 97, 255, 0.4);
        }

        .planet-2 {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 4%;
            background: radial-gradient(circle at 30% 30%, #00f0ff, #004d61);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* CARDS & CONTAINERS */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card, .project-card, .cosmic-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-cosmic);
            border-radius: var(--radius-cosmic);
            padding: 35px;
            margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            border-top-left-radius: var(--radius-cosmic);
            border-top-right-radius: var(--radius-cosmic);
            background: linear-gradient(90deg, var(--primary-glow), var(--cyan-glow));
        }

        /* FORM ELEMENTS & BUTTONS */
        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            display: block;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(11, 13, 23, 0.85) !important;
            border: 1px solid var(--border-cosmic) !important;
            color: var(--text-main) !important;
            border-radius: 10px !important;
            padding: 14px 18px !important;
            margin-bottom: 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: var(--cyan-glow) !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4) !important;
        }

        .btn, .btn-primary, button[type="submit"] {
            background: linear-gradient(135deg, var(--primary-glow) 0%, #4a00e0 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px 24px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(123, 97, 255, 0.4);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        .btn:hover, .btn-primary:hover, button[type="submit"]:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <!-- DEKORASI PLANET MELAYANG -->
    <div class="planet-bg planet-1"></div>
    <div class="planet-bg planet-2"></div>

    <!-- NAVBAR HEADER -->
    <header>
        <a href="/" class="nav-brand">
            ✨ COSMIC AI
        </a>
        <nav class="nav-links">
            <a href="/" class="btn-nav">🏠 Home</a>
            <a href="/projects" class="btn-nav">🚀 Projects</a>
        </nav>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- HERO SECTION -->
        <section style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
            <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #ffffff 20%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Buat Script Konten Lebih Cepat dengan AI
            </h1>
            <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 650px; margin: 0 auto; line-height: 1.6;">
                Rancang outline, skrip video, dan metadata otomatis untuk TikTok, YouTube, Reels, dan platform lainnya dengan asisten bertenaga kecerdasan kosmik.
            </p>
        </section>

        <!-- FORM GENERATOR -->
        <div class="card" style="max-width: 650px; margin: 0 auto;">
            <h2 style="font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 700;">
                💫 Buat Project Baru
            </h2>

            <form action="/generate" method="POST">
                
                <div>
                    <label for="topic">Topik / Judul Konten</label>
                    <input 
                        type="text" 
                        id="topic" 
                        name="topic" 
                        placeholder="Contoh: 5 Tips Produktivitas untuk Mahasiswa" 
                        required
                    >
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label for="duration">Durasi Konten</label>
                        <select id="duration" name="duration" required>
                            <option value="Short (60s)">Short (60 detik / Reels / TikTok)</option>
                            <option value="Medium (3-5 min)">Medium (3-5 menit)</option>
                            <option value="Long (8-10 min)">Long (8-10 menit / YouTube)</option>
                        </select>
                    </div>

                    <div>
                        <label for="language">Bahasa</label>
                        <select id="language" name="language" required>
                            <option value="Indonesian" selected>Indonesia</option>
                            <option value="English">Inggris</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="audience">Target Audience</label>
                    <input 
                        type="text" 
                        id="audience" 
                        name="audience" 
                        placeholder="Contoh: Gen Z, Pekerja Kantoran, Pemula" 
                        required
                    >
                </div>

                <button type="submit" class="btn" style="margin-top: 10px;">
                    ✨ Generate Script Sekarang
                </button>

            </form>
        </div>

    </main>

</body>
</html>
