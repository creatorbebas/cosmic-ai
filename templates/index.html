<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI - Generator Script AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ELEMEN DEKORASI PLANET KOSMIK -->
    <div class="planet-bg planet-1"></div>
    <div class="planet-bg planet-2"></div>

    <!-- NAVBAR HEADER -->
    <header>
        <a href="/" class="nav-brand">
            ✨ COSMIC AI
        </a>
        <nav class="nav-links">
            <a href="/" class="btn-nav">Home</a>
            <a href="/projects" class="btn-nav">🚀 Projects</a>
        </nav>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- HERO SECTION -->
        <section style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #ffffff 0%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Buat Script Konten Lebih Cepat dengan AI
            </h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                Rancang outline, skrip video, dan metadata otomatis untuk TikTok, YouTube, Reels, dan platform lainnya.
            </p>
        </section>

        <!-- FORM GENERATOR -->
        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <h2 style="font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                🚀 Buat Project Baru
            </h2>

            <form action="/generate" method="POST">
                
                <div style="margin-bottom: 16px;">
                    <label for="topic" style="font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px;">
                        Topik / Judul Konten
                    </label>
                    <input 
                        type="text" 
                        id="topic" 
                        name="topic" 
                        placeholder="Contoh: 5 Tips Produktivitas untuk Mahasiswa" 
                        required
                    >
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div>
                        <label for="duration" style="font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px;">
                            Durasi Konten
                        </label>
                        <select id="duration" name="duration" required>
                            <option value="Short (60s)">Short (60 detik / Reels / TikTok)</option>
                            <option value="Medium (3-5 min)">Medium (3-5 menit)</option>
                            <option value="Long (8-10 min)">Long (8-10 menit / YouTube)</option>
                        </select>
                    </div>

                    <div>
                        <label for="language" style="font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px;">
                            Bahasa
                        </label>
                        <select id="language" name="language" required>
                            <option value="Indonesian" selected>Indonesia</option>
                            <option value="English">Inggris</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 16px; margin-bottom: 24px;">
                    <label for="audience" style="font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px;">
                        Target Audience
                    </label>
                    <input 
                        type="text" 
                        id="audience" 
                        name="audience" 
                        placeholder="Contoh: Gen Z, Pekerja Kantoran, Pemula" 
                        required
                    >
                </div>

                <button type="submit" class="btn" style="width: 100%; font-size: 1.05rem; padding: 14px;">
                    ✨ Generate Script Sekarang
                </button>

            </form>
        </div>

    </main>

</body>
</html>
